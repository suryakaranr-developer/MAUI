name: CI

# Fast feedback on every change: unit tests plus an Android compile.
# Deliberately no macOS job here — iOS is covered by the CD pipeline, and macOS runner
# minutes bill at 10x the Linux rate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # global.json pins 10.0.300 with allowPrerelease, so let it pick the SDK rather
      # than hardcoding a version here that would drift out of sync.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Only the platform-free projects. Restoring the whole solution would drag in the
      # MAUI targets and fail without the workload.
      - name: Test
        run: >
          dotnet test CompanyName.AppName.Core.Tests/CompanyName.AppName.Core.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  build-android:
    name: Build Android (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        environment: [UAT, STAGE, RELEASE]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      # Compile only. Producing a shippable artifact is the CD pipeline's job.
      - name: Build
        run: >
          dotnet build CompanyName.AppName.MAUI/CompanyName.AppName.MAUI.csproj
          --framework net9.0-android
          --configuration Release
          -p:AppEnvironment=${{ matrix.environment }}
          -p:AndroidPackageFormat=apk
