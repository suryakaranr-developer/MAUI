name: CI

# Fast feedback on every change, tuned for GitHub Actions minutes (macOS bills at 10x Linux):
#   - Docs-only changes skip the pipeline entirely (paths-ignore).
#   - Unit tests and Android run on hosted Linux; a failing test or Android build stops the run
#     before any macOS minute is spent (iOS `needs` both).
#   - Pull requests and pushes build ONE environment (UAT). Pick the environment, or "all", when
#     you run it by hand from the Actions tab, so nobody pays for flavours they did not ask for.
#   - Runners are overridable with repo variables ANDROID_RUNNER / IOS_RUNNER, a JSON label
#     list, e.g. IOS_RUNNER=["self-hosted","macOS","ARM64","ios"] to use a self-hosted Mac.
#   - Every job has a timeout so a hung build cannot burn the monthly allowance.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to compile
        required: true
        type: choice
        options: [UAT, STAGE, RELEASE, all]
        default: UAT
      include_ios:
        description: Also compile for iOS (uses macOS minutes)
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # global.json pins 10.0.300 with allowPrerelease, so let it pick the SDK rather
      # than hardcoding a version here that would drift out of sync.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Only the platform-free projects. Restoring the whole solution would drag in the
      # MAUI targets and fail without the workload.
      - name: Test
        run: >
          dotnet test CompanyName.AppName.Core.Tests/CompanyName.AppName.Core.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 1

  build-android:
    name: Build Android (${{ matrix.environment }})
    runs-on: ${{ fromJSON(vars.ANDROID_RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.environment == 'all' && '["UAT","STAGE","RELEASE"]' || format('["{0}"]', inputs.environment)) || '["UAT"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      # Compile only. Producing a shippable artifact is the CD pipeline's job.
      - name: Build
        run: >
          dotnet build CompanyName.AppName.MAUI/CompanyName.AppName.MAUI.csproj
          --framework net9.0-android
          -p:TargetFrameworkOverride=net9.0-android
          --configuration Release
          -p:AppEnvironment=${{ matrix.environment }}
          -p:AndroidPackageFormat=apk

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          bin=CompanyName.AppName.MAUI/bin/Release/net9.0-android
          apk=$(ls "$bin"/*-Signed.apk 2>/dev/null | head -1 || true)
          [ -n "$apk" ] || apk=$(ls "$bin"/*.apk | head -1)
          cp "$apk" "out/MAUI-${{ matrix.environment }}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.environment }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Show artifacts on the run summary
        if: always()
        run: |
          {
            echo "### Android build (${{ matrix.environment }})"
            if ls out/* >/dev/null 2>&1; then
              echo "| File | Size |"
              echo "| --- | --- |"
              for f in out/*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
              echo ""
              echo "Download the APK from **Artifacts** at the bottom of this page (kept 1 day). Signed AAB/APK builds come from the CD workflow."
            else
              echo "No installable file was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    name: Build iOS (${{ matrix.environment }})
    # macOS minutes cost 10x: never on pull requests, and by hand only when asked for. Starts
    # only once tests and the Android build have passed.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_ios)
    runs-on: ${{ fromJSON(vars.IOS_RUNNER || '["macos-latest"]') }}
    timeout-minutes: 30
    needs: [test, build-android]
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.environment == 'all' && '["UAT","STAGE","RELEASE"]' || format('["{0}"]', inputs.environment)) || '["UAT"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-ios-${{ runner.os }}-

      # Pin the workload set to the SDK version (global.json) so a newer iOS SDK that needs a
      # not-yet-installed Xcode is never pulled in.
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-sign-check --version "$(dotnet --version)"

      # The iOS SDK pack is tied to one Xcode release (e.g. SDK 26.5 needs Xcode 26.5) and the
      # runner's default Xcode is often newer, which fails with "requires Xcode X". Pick the
      # Xcode that matches the SDK the workload actually installed.
      - name: Select Xcode matching the iOS SDK
        run: |
          set -euo pipefail
          pack=$(ls -d "${DOTNET_ROOT:-$HOME/.dotnet}"/packs/Microsoft.iOS.Sdk.net9.0_*/*/ | sort -V | tail -1)
          # The pack's own manifest says which Xcode it requires (its folder name can differ).
          want=$(/usr/libexec/PlistBuddy -c "Print :RecommendedXcodeVersion" "${pack}Versions.plist")
          echo "iOS SDK pack: $pack (needs Xcode $want)"
          xcode=$(find /Applications -maxdepth 1 -name "Xcode_${want}*.app" -type d ! -iname '*beta*' ! -iname '*RC*' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::Xcode $want is not installed on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      # Compile only, for the simulator so no certificate is needed. The signed IPA is the
      # CD pipeline's job.
      - name: Build
        run: >
          dotnet build CompanyName.AppName.MAUI/CompanyName.AppName.MAUI.csproj
          --framework net9.0-ios
          -p:TargetFrameworkOverride=net9.0-ios
          --configuration Debug
          -p:AppEnvironment=${{ matrix.environment }}
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:EnableAssemblyILStripping=false
          -p:MtouchLink=None
          -p:CodesignKey=

      - name: Package simulator app
        run: |
          set -euo pipefail
          mkdir -p out
          app=$(find CompanyName.AppName.MAUI/bin/Debug/net9.0-ios -maxdepth 3 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::No .app produced"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" "out/MAUI-${{ matrix.environment }}-ios-simulator.zip"

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ matrix.environment }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 1

      - name: Show artifacts on the run summary
        if: always()
        run: |
          {
            echo "### iOS build (${{ matrix.environment }})"
            if ls out/* >/dev/null 2>&1; then
              echo "| File | Size |"
              echo "| --- | --- |"
              for f in out/*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
              echo ""
              echo "This is a simulator build (runs in the iOS Simulator). A signed, installable **IPA** is produced by the CD workflow once the iOS signing secrets are set."
            else
              echo "No installable file was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
