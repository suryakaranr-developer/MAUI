name: CD

# Produces installable artifacts for one environment at a time.
#
# Run it from the Actions tab ("Run workflow") and pick UAT, STAGE or RELEASE, or push a
# tag: v*-uat / v*-stage / v* map to the matching environment.
#
# Signing is optional. With no signing secrets configured the pipeline still runs green and
# emits an unsigned APK and a simulator build, so the pipeline is useful on day one. Add the
# secrets to a GitHub Environment and the same jobs start emitting a signed APK and an IPA.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [UAT, STAGE, RELEASE]
        default: UAT
      version:
        description: Display version, e.g. 1.4.0 (defaults to 1.0.<run number>)
        required: false
        type: string
      platforms:
        description: Platforms to build
        required: true
        type: choice
        options: [both, android, ios]
        default: both
  push:
    tags:
      - 'v*'

concurrency:
  group: cd-${{ github.ref }}-${{ inputs.environment || 'tag' }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Resolves the environment, version and platform selection once so the build jobs agree,
  # whether they were triggered by a manual run or by a tag push.
  setup:
    name: Resolve build parameters
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      display_version: ${{ steps.resolve.outputs.display_version }}
      build_version: ${{ github.run_number }}
      build_android: ${{ steps.resolve.outputs.build_android }}
      build_ios: ${{ steps.resolve.outputs.build_ios }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="${{ inputs.environment }}"
            platforms="${{ inputs.platforms }}"
            version="${{ inputs.version }}"
          else
            # Tag suffix picks the environment: v1.2.3-uat, v1.2.3-stage, or plain v1.2.3.
            tag="${GITHUB_REF_NAME}"
            case "$tag" in
              *-uat)   environment=UAT ;;
              *-stage) environment=STAGE ;;
              *)       environment=RELEASE ;;
            esac
            platforms=both
            version="$(printf '%s' "${tag#v}" | sed -E 's/-(uat|stage)$//')"
          fi

          [ -n "$version" ] || version="1.0.${{ github.run_number }}"

          case "$platforms" in
            both)    build_android=true;  build_ios=true  ;;
            android) build_android=true;  build_ios=false ;;
            ios)     build_android=false; build_ios=true  ;;
          esac

          {
            echo "environment=$environment"
            echo "display_version=$version"
            echo "build_android=$build_android"
            echo "build_ios=$build_ios"
          } >> "$GITHUB_OUTPUT"

          echo "Building $environment v$version (android=$build_android ios=$build_ios)"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test
        run: >
          dotnet test CompanyName.AppName.Core.Tests/CompanyName.AppName.Core.Tests.csproj
          --configuration Release

  android:
    name: Android (${{ needs.setup.outputs.environment }})
    needs: [setup, test]
    if: needs.setup.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    # Drives approval gates and scopes the signing secrets. Create these under
    # Settings → Environments with the same names.
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      # Secrets cannot be referenced from a job-level `if`, so signing availability is
      # resolved into a step output the later steps branch on.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — producing an unsigned APK."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Written outside the workspace so it can never be picked up by a later
          # artifact upload glob.
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing.keystore"

      - name: Publish signed AAB + APK
        if: steps.signing.outputs.enabled == 'true'
        run: >
          dotnet publish CompanyName.AppName.MAUI/CompanyName.AppName.MAUI.csproj
          --framework net9.0-android
          -p:TargetFrameworkOverride=net9.0-android
          --configuration Release
          --output ./artifacts/android
          -p:AppEnvironment=${{ needs.setup.outputs.environment }}
          -p:ApplicationDisplayVersion=${{ needs.setup.outputs.display_version }}
          -p:ApplicationVersion=${{ needs.setup.outputs.build_version }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=$RUNNER_TEMP/signing.keystore
          -p:AndroidSigningStorePass='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}'
          -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Publish unsigned APK
        if: steps.signing.outputs.enabled != 'true'
        run: >
          dotnet publish CompanyName.AppName.MAUI/CompanyName.AppName.MAUI.csproj
          --framework net9.0-android
          -p:TargetFrameworkOverride=net9.0-android
          --configuration Release
          --output ./artifacts/android
          -p:AppEnvironment=${{ needs.setup.outputs.environment }}
          -p:ApplicationDisplayVersion=${{ needs.setup.outputs.display_version }}
          -p:ApplicationVersion=${{ needs.setup.outputs.build_version }}
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keystore"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.setup.outputs.environment }}-${{ needs.setup.outputs.display_version }}
          path: |
            ./artifacts/android/*.apk
            ./artifacts/android/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (${{ needs.setup.outputs.environment }})
    needs: [setup, test]
    if: needs.setup.outputs.build_ios == 'true'
    runs-on: macos-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-ios-${{ runner.os }}-

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-sign-check

      - name: Check for signing secrets
        id: signing
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No iOS signing secrets — building for the simulator instead of an IPA."
          fi

      - name: Import certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          cert_path="$RUNNER_TEMP/cert.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$CERT" | base64 -d > "$cert_path"
          printf '%s' "$PROFILE" | base64 -d > "$profile_path"

          # A throwaway keychain rather than the login one: it is unlocked only for this
          # job and discarded with the runner.
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$profile_path" ~/Library/MobileDevice/Provisioning\ Profiles/

          rm -f "$cert_path" "$profile_path"

      - name: Publish signed IPA
        if: steps.signing.outputs.enabled == 'true'
        run: >
          dotnet publish CompanyName.AppName.MAUI/CompanyName.AppName.MAUI.csproj
          --framework net9.0-ios
          -p:TargetFrameworkOverride=net9.0-ios
          --configuration Release
          --output ./artifacts/ios
          -p:AppEnvironment=${{ needs.setup.outputs.environment }}
          -p:ApplicationDisplayVersion=${{ needs.setup.outputs.display_version }}
          -p:ApplicationVersion=${{ needs.setup.outputs.build_version }}
          -p:RuntimeIdentifier=ios-arm64
          -p:BuildIpa=true
          -p:CodesignKey='${{ secrets.IOS_CODESIGN_KEY }}'
          -p:CodesignProvision='${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}'

      # Without a certificate an IPA is impossible, so verify the code still compiles for
      # iOS by targeting the simulator, which needs no signing identity.
      - name: Build for simulator (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: >
          dotnet build CompanyName.AppName.MAUI/CompanyName.AppName.MAUI.csproj
          --framework net9.0-ios
          -p:TargetFrameworkOverride=net9.0-ios
          --configuration Release
          -p:AppEnvironment=${{ needs.setup.outputs.environment }}
          -p:ApplicationDisplayVersion=${{ needs.setup.outputs.display_version }}
          -p:ApplicationVersion=${{ needs.setup.outputs.build_version }}
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:CodesignKey=

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Upload IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.setup.outputs.environment }}-${{ needs.setup.outputs.display_version }}
          path: ./artifacts/ios/*.ipa
          if-no-files-found: error
          retention-days: 30
